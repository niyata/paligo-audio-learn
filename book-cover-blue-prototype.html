<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paligo Blue Book Cover Prototype</title>
  <style>
    :root {
      --paligo-ink: #172967;
      --paligo-gold: #d9a438;
      --paligo-gold-soft: #ffe08a;
      --paligo-paper: #f5efe4;
      --paligo-blue: #091b34;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background:
        radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.52), transparent 34rem),
        var(--paligo-paper);
      color: #2f2f34;
      font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: 32px;
    }

    main {
      display: grid;
      gap: 28px;
      justify-content: center;
    }

    .prototype-note {
      color: rgba(23, 41, 103, 0.72);
      font-size: 0.95rem;
      font-weight: 760;
      margin: 0;
      max-width: 760px;
    }

    .cover-grid {
      align-items: start;
      display: grid;
      gap: 28px;
      grid-template-columns: minmax(280px, 560px) minmax(220px, 280px);
    }

    .paligo-blue-cover {
      aspect-ratio: 2 / 3;
      background:
        linear-gradient(rgba(7, 20, 38, 0.03), rgba(7, 20, 38, 0.03)),
        url("assets/book-cover/paligo-blue-gold-cover-frame.png") center / cover no-repeat,
        var(--paligo-blue);
      border-radius: 4px;
      box-shadow:
        0 22px 42px rgba(16, 26, 45, 0.2),
        0 1px 0 rgba(255, 255, 255, 0.42) inset;
      color: var(--paligo-gold-soft);
      display: grid;
      overflow: hidden;
      padding: 8.5% 9.5% 11.5%;
      position: relative;
      text-align: center;
      width: 100%;
    }

    .paligo-blue-cover__body {
      align-items: center;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      min-height: 0;
    }

    .paligo-blue-cover__avatar {
      align-self: end;
      background: #f9e8b5;
      border: 3px solid rgba(217, 164, 56, 0.82);
      border-radius: 999px;
      box-shadow:
        0 0 0 4px rgba(7, 20, 38, 0.48),
        0 12px 28px rgba(0, 0, 0, 0.28);
      height: clamp(72px, 16vw, 118px);
      justify-self: center;
      overflow: hidden;
      width: clamp(72px, 16vw, 118px);
    }

    .paligo-blue-cover__avatar img {
      display: block;
      height: 100%;
      object-fit: cover;
      width: 100%;
    }

    .paligo-blue-cover__content {
      display: grid;
      gap: clamp(8px, 1.35vw, 14px);
      justify-items: center;
      padding: clamp(30px, 6vw, 64px) 0 clamp(18px, 3vw, 32px);
      text-shadow: 0 2px 0 rgba(7, 20, 38, 0.72);
    }

    .paligo-blue-cover__grade,
    .paligo-blue-cover__date,
    .paligo-blue-cover__affiliation {
      color: rgba(247, 231, 187, 0.88);
      font-weight: 800;
      line-height: 1.24;
      max-width: 100%;
      white-space: nowrap;
    }

    .paligo-blue-cover__grade {
      font-size: clamp(1rem, 2.9vw, 1.45rem);
    }

    .paligo-blue-cover__subject {
      color: var(--paligo-gold-soft);
      font-size: clamp(1.55rem, 4.2vw, 2.55rem);
      font-weight: 900;
      line-height: 1.16;
      max-width: 100%;
      white-space: nowrap;
    }

    .paligo-blue-cover__date {
      font-size: clamp(0.9rem, 2.2vw, 1.22rem);
    }

    .paligo-blue-cover__affiliation {
      color: rgba(247, 231, 187, 0.76);
      font-size: clamp(0.66rem, 1.48vw, 0.88rem);
      max-width: min(100%, 33rem);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .paligo-blue-cover.is-card {
      border-radius: 14px;
      max-width: 280px;
      padding: 8.5% 10% 12%;
    }

    .paligo-blue-cover.is-card .paligo-blue-cover__avatar {
      height: 58px;
      width: 58px;
    }

    .paligo-blue-cover.is-card .paligo-blue-cover__grade {
      font-size: 0.82rem;
    }

    .paligo-blue-cover.is-card .paligo-blue-cover__subject {
      font-size: 0.98rem;
    }

    .paligo-blue-cover.is-card .paligo-blue-cover__date {
      font-size: 0.72rem;
    }

    .paligo-blue-cover.is-card .paligo-blue-cover__affiliation {
      font-size: 0.54rem;
      max-width: 15rem;
    }

    @media (max-width: 860px) {
      body {
        padding: 18px;
      }

      .cover-grid {
        grid-template-columns: minmax(280px, 560px);
      }
    }

    @media (max-width: 440px) {
      .paligo-blue-cover {
        padding-left: 8%;
        padding-right: 8%;
      }

      .paligo-blue-cover__subject {
        font-size: clamp(1.14rem, 5.2vw, 1.4rem);
      }

      .paligo-blue-cover__affiliation {
        font-size: 0.58rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="prototype-note">
      Prototype: ปกสมุดสีน้ำเงินจากภาพจริง พร้อมช่องรูปโปรไฟล์และบรรทัดสังกัดแบบบรรทัดเดียว
    </p>

    <section class="cover-grid" aria-label="ตัวอย่างปกสมุด">
      <article class="paligo-blue-cover" aria-label="ตัวอย่างปกสมุดขนาดใหญ่">
        <div class="paligo-blue-cover__body">
          <div class="paligo-blue-cover__avatar" aria-label="รูปโปรไฟล์">
            <img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%23ffeab6'/%3E%3Ccircle cx='60' cy='42' r='22' fill='%23293298'/%3E%3Cpath d='M28 104c8-31 23-46 32-46s24 15 32 46z' fill='%23293298'/%3E%3C/svg%3E">
          </div>

          <div class="paligo-blue-cover__content">
            <div class="paligo-blue-cover__grade">ประโยค ป.ธ. ๔</div>
            <div class="paligo-blue-cover__subject">วิชา แปลมคธเป็นไทย</div>
            <div class="paligo-blue-cover__date">สอบ วันที่ ๒๒ กรกฎาคม ๒๕๖๙</div>
            <div class="paligo-blue-cover__affiliation">สังกัด : โรงเรียนปริยัติธรรมวัดพระธรรมกาย</div>
          </div>

        </div>
      </article>

      <article class="paligo-blue-cover is-card" aria-label="ตัวอย่างปกสมุดขนาดการ์ด">
        <div class="paligo-blue-cover__body">
          <div class="paligo-blue-cover__avatar" aria-label="รูปโปรไฟล์">
            <img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%23ffeab6'/%3E%3Ccircle cx='60' cy='42' r='22' fill='%23293298'/%3E%3Cpath d='M28 104c8-31 23-46 32-46s24 15 32 46z' fill='%23293298'/%3E%3C/svg%3E">
          </div>

          <div class="paligo-blue-cover__content">
            <div class="paligo-blue-cover__grade">ประโยค ป.ธ. ๔</div>
            <div class="paligo-blue-cover__subject">วิชา แปลไทยเป็นมคธ</div>
            <div class="paligo-blue-cover__date">สอบ วันที่ ๒๒ กรกฎาคม ๒๕๖๙</div>
            <div class="paligo-blue-cover__affiliation">สังกัด : โรงเรียนปริยัติธรรมวัดพระธรรมกาย</div>
          </div>

        </div>
      </article>
    </section>
  </main>
</body>
</html>
