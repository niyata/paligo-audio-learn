name: Production hardening checks

on:
  pull_request:
    paths:
      - "_headers"
      - "robots.txt"
      - ".gitignore"
      - "exam-*.html"
      - "workbook.html"
      - "pali-reference-pip.html"
      - "paligo-*.js"
      - "workers/src/**"
      - "scripts/**"
      - "docs/production-hardening-5-pillars.md"
      - "docs/deploy-production-checklist.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Whitespace guard
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check
          fi

      - name: Syntax check critical scripts
        run: node --check scripts/run-production-hardening.mjs

      - name: Production hardening gate
        run: node scripts/run-production-hardening.mjs
